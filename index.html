<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кафе и рестораны</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --city-h: 150px; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px 16px 90px;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
  h1 { font-size: 20px; margin: 8px 0 12px; }
  .shop-title { font-size: 17px; margin: 20px 0 4px; color: var(--tg-theme-hint-color, #888); }
  .card { display: block; width: 100%; text-align: left; padding: 14px; margin: 8px 0;
          border: none; border-radius: 12px; font-size: 16px; color: inherit; box-sizing: border-box;
          background: var(--tg-theme-secondary-bg-color, #f1f1f1); }
  .shop { display: flex; align-items: center; gap: 12px; }
  .shop-img { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
              background: #ddd; display: block; margin: 0; }
  .shop-info { flex: 1; min-width: 0; }
  .city { position: relative; display: block; width: 100%; height: var(--city-h); margin: 10px 0; padding: 0;
          border: none; border-radius: 14px; overflow: hidden; cursor: pointer;
          background: linear-gradient(135deg, #2481cc, #7fc4f5); }
  .city img { width: 100%; height: 100%; object-fit: cover; display: block; margin: 0; border-radius: 0; }
  .city span { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 14px 10px;
               color: #fff; font-size: 18px; font-weight: bold; text-align: left;
               background: linear-gradient(transparent, rgba(0,0,0,.65)); }
  .bbar { display: flex; gap: 10px; margin-top: 14px; }
  .bbtn { position: relative; flex: 1 1 0; width: 50%; height: calc(var(--city-h) / 3); padding: 0;
          border: none; border-radius: 12px; overflow: hidden; cursor: pointer;
          background: linear-gradient(135deg, #cfd8e3, #9fb3c8); }
  .bbtn img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .bbtn span { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; color: #fff;
               font-size: 13px; font-weight: bold; text-align: left;
               background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .support { display: block; width: 100%; margin-top: 12px; padding: 10px; border: none; background: none;
             color: var(--tg-theme-link-color, #2481cc); font-size: 16px; text-align: center; cursor: pointer; }
  .back { background: none; border: none; color: var(--tg-theme-link-color, #2481cc);
          font-size: 16px; padding: 0; margin-bottom: 8px; }
  .price { font-weight: bold; margin-top: 4px; }
  .muted { color: #888; font-size: 14px; }
  .hint { font-size: 13px; color: #888; margin: -6px 0 6px; }
  .add { width: 100%; padding: 14px; margin-top: 8px; border: none; border-radius: 12px; font-size: 16px;
         background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .add:disabled { opacity: .6; }
  .danger { width: 100%; padding: 12px; margin-top: 12px; border: none; background: none;
            color: #c0392b; font-size: 15px; }
  .qty { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 8px; }
  .qty button { width: 44px; height: 44px; border: none; border-radius: 10px; font-size: 22px;
                background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .qty span { font-size: 18px; min-width: 24px; text-align: center; }
  .search { width: 100%; box-sizing: border-box; padding: 10px 12px; margin: 6px 0 8px; font-size: 16px;
            border-radius: 10px; border: 1px solid #ccc; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 8px; margin: 6px 0;
          border-radius: 12px; background: var(--tg-theme-secondary-bg-color, #f1f1f1); cursor: pointer; }
  .pthumb { width: 88px; height: 88px; object-fit: cover; border-radius: 10px; flex-shrink: 0;
            background: #ddd; display: block; margin: 0; }
  .pinfo { flex: 1; min-width: 0; }
  .pinfo b { font-size: 15px; }
  .pinfo .muted { font-size: 12px; margin-top: 2px; }
  .pinfo .price { font-size: 15px; }
  .paction { flex-shrink: 0; }
  .pgo { font-size: 26px; color: #888; padding-right: 4px; }
  .addsmall { width: 40px; height: 40px; border: none; border-radius: 10px; font-size: 22px;
              background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .prow .qty { margin: 0; gap: 8px; }
  .prow .qty button { width: 34px; height: 34px; font-size: 18px; }
  .prow .qty span { font-size: 15px; min-width: 18px; }
  .cartbar { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 14px; border-radius: 12px;
             text-align: center; font-weight: bold; cursor: pointer;
             background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .form label { display: block; margin: 12px 0; font-size: 14px; }
  .form input, .form select, .form textarea { width: 100%; box-sizing: border-box; padding: 10px;
    margin-top: 4px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
  .loading { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<div id="app"><p class="muted loading">Загрузка...</p></div>

<script>
const SUPABASE_URL = 'https://uwafdyrpyrcnjliwystd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jIxy3j0mu8dLYCpa4T1hyg_npMmhEwD';
const SUPPORT_NICK = 'Viktor_Kitay_legko';
const DEFAULT_FEE = 450;

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const app = document.getElementById('app');
let currentCityId = null;
let shopsCache = [];
let view = null;      // {shopId, shopName, fee, products, query, parentId, path}
let formData = null;
let screen = 'cities';
let bottomList = [];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showLoading() {
  app.innerHTML = '<p class="muted loading">Загрузка...</p>';
}

function showError(error, retry) {
  app.innerHTML = `<p>Не удалось загрузить данные. Проверьте интернет.</p>
    <p class="muted">${esc(error?.message || '')}</p>
    <button class="add" id="retryBtn">Повторить</button>`;
  document.getElementById('retryBtn').onclick = retry;
}

// ---------- Данные Telegram и проверки ----------
function tgUser() {
  return window.Telegram?.WebApp?.initDataUnsafe?.user || null;
}
function tgName() {
  const u = tgUser();
  return u ? [u.first_name, u.last_name].filter(Boolean).join(' ') : '';
}
function normalizePhone(raw) {
  let s = String(raw || '').replace(/[\s\-()]/g, '');
  if (/^8\d{10}$/.test(s)) s = '+7' + s.slice(1);
  if (/^7\d{10}$/.test(s)) s = '+' + s;
  return /^\+\d{10,15}$/.test(s) ? s : null;
}
function cleanNick(raw) {
  const s = String(raw || '').trim().replace(/^@/, '');
  return /^[A-Za-z0-9_]{5,32}$/.test(s) ? s : null;
}

// ---------- Внешние ссылки ----------
function openExternal(url) {
  if (!url) return;
  if (tg?.openTelegramLink && /^https:\/\/t\.me\//i.test(url)) tg.openTelegramLink(url);
  else if (tg?.openLink) tg.openLink(url);
  else window.open(url, '_blank');
}

function openBottom(i) {
  openExternal(bottomList[i]?.link_url);
}

function openSupport() {
  openExternal(`https://t.me/${SUPPORT_NICK}`);
}

function bottomButtonsHtml() {
  const slots = [1, 2].map(slot => bottomList.find(b => b.slot === slot) || { slot });
  return '<div class="bbar">' + slots.map((b, i) => `
    <button class="bbtn" onclick="openBottom(${i})">
      ${b.image_url ? `<img src="${esc(b.image_url)}" alt="">` : ''}
      ${b.title ? `<span>${esc(b.title)}</span>` : ''}
    </button>`).join('') + '</div>' +
    `<button class="support" onclick="openSupport()">Техническая поддержка</button>`;
}

// ---------- Корзина: {shops: {shopId: {shopId, shopName, fee, items: {productId: {...}}}}} ----------
function loadCart() {
  try {
    return JSON.parse(localStorage.getItem('cart_v2')) || { shops: {} };
  } catch (e) {
    return { shops: {} };
  }
}
let cart = loadCart();

function saveCart() {
  try { localStorage.setItem('cart_v2', JSON.stringify(cart)); } catch (e) {}
}
function emptyCart() {
  cart = { shops: {} };
  saveCart();
}
function cartCount() {
  return Object.values(cart.shops).reduce((s, sh) =>
    s + Object.values(sh.items).reduce((t, i) => t + i.qty, 0), 0);
}
function shopGoods(sh) {
  return Object.values(sh.items).reduce((t, i) => t + i.qty * i.price_rub, 0);
}
function shopFee(sh) {
  return sh.fee ?? DEFAULT_FEE;
}
function cartGoods() {
  return Object.values(cart.shops).reduce((s, sh) => s + shopGoods(sh), 0);
}
function cartDelivery() {
  return Object.values(cart.shops).reduce((s, sh) => s + shopFee(sh), 0);
}
// Итог к оплате: товары всех заведений плюс доставка каждого
function cartTotal() {
  return cartGoods() + cartDelivery();
}
function shopCount() {
  return Object.keys(cart.shops).length;
}
function qtyIn(shopId, productId) {
  return cart.shops[shopId]?.items[productId]?.qty || 0;
}

function addToCart(productId) {
  const sid = view.shopId;
  const p = view.products.find(x => x.id === productId);
  if (!cart.shops[sid]) cart.shops[sid] = { shopId: sid, shopName: view.shopName, fee: view.fee, items: {} };
  const shop = cart.shops[sid];
  shop.fee = view.fee;
  const it = shop.items[productId] || { id: p.id, name: p.name, price_rub: p.price_rub, qty: 0 };
  it.qty += 1;
  shop.items[productId] = it;
  saveCart();
  renderProducts();
}

function changeQty(shopId, productId, delta) {
  const shop = cart.shops[shopId];
  if (!shop || !shop.items[productId]) return;
  const it = shop.items[productId];
  it.qty += delta;
  if (it.qty <= 0) delete shop.items[productId];
  if (Object.keys(shop.items).length === 0) delete cart.shops[shopId];
  saveCart();
  if (screen === 'cart') {
    openCart();
  } else {
    renderProducts();
  }
}

function clearCart() {
  if (!confirm('Очистить корзину?')) return;
  emptyCart();
  showCities();
}

function cartBar() {
  if (cartCount() === 0) return '';
  return `<div class="cartbar" onclick="openCart()">
    Корзина: ${cartCount()} шт. · ${cartTotal()} ₽ (с доставкой) · заведений: ${shopCount()} →</div>`;
}

// ---------- Экраны ----------
async function showCities() {
  screen = 'cities';
  showLoading();
  const [cr, br] = await Promise.all([
    db.from('cities').select('*').order('sort_order'),
    db.from('bottom_buttons').select('*').order('slot'),
  ]);
  if (cr.error) return showError(cr.error, showCities);
  bottomList = br.error ? [] : (br.data || []);

  let html = '<h1>Выберите город</h1>' + cr.data.map(c => `
    <button class="city" onclick="openCity(${c.id})">
      ${c.image_url ? `<img src="${esc(c.image_url)}" alt="">` : ''}
      <span>${esc(c.name)}</span>
    </button>`).join('');
  if (cr.data.length === 0) html += '<p class="muted">Городов пока нет.</p>';
  html += bottomButtonsHtml();
  if (cartCount() > 0) {
    html += `<button class="card" onclick="openCart()"><b>Корзина</b><br>
      ${cartCount()} шт. · ${cartTotal()} ₽ с доставкой · заведений: ${shopCount()}</button>`;
  }
  app.innerHTML = html;
}

async function openCity(cityId) {
  currentCityId = cityId;
  screen = 'shops';
  showLoading();
  const { data, error } = await db.from('shops').select('*')
    .eq('city_id', cityId).order('sort_order');
  if (error) return showError(error, () => openCity(cityId));
  shopsCache = data;
  let html = '<button class="back" onclick="showCities()">← Города</button>' +
    '<h1>Кафе и рестораны</h1>';
  if (data.length === 0) html += '<p class="muted">В этом городе пока нет заведений.</p>';
  html += data.map(s => `
    <button class="card shop" onclick="openShop(${s.id})">
      ${s.image_url
        ? `<img class="shop-img" src="${esc(s.image_url)}" alt="">`
        : '<div class="shop-img"></div>'}
      <div class="shop-info">
        <b>${esc(s.name)}</b>
        ${s.description ? `<div class="muted">${esc(s.description)}</div>` : ''}
        <div class="muted">Доставка: ${s.delivery_fee_rub ?? DEFAULT_FEE} ₽</div>
      </div>
    </button>`).join('');
  app.innerHTML = html + cartBar();
}

async function openShop(shopId) {
  screen = 'products';
  showLoading();
  const shop = shopsCache.find(s => s.id === shopId);
  const { data, error } = await db.from('products').select('*')
    .eq('shop_id', shopId).eq('in_stock', true).order('sort_order');
  if (error) return showError(error, () => openShop(shopId));
  view = {
    shopId,
    shopName: shop?.name || '',
    fee: shop?.delivery_fee_rub ?? DEFAULT_FEE,
    products: data,
    query: '',
    parentId: null,
    path: [],
  };
  renderProducts();
}

// ---------- Группы (папки) и товары ----------
function childrenOf(parentId) {
  return view.products.filter(p => (p.parent_id ?? null) === parentId);
}
function hasChildren(id) {
  return view.products.some(p => p.parent_id === id);
}
function minPrice(id) {
  let min = null;
  for (const c of childrenOf(id)) {
    const v = hasChildren(c.id) ? minPrice(c.id) : c.price_rub;
    if (v != null && (min == null || v < min)) min = v;
  }
  return min;
}

function openFolder(id) {
  const p = view.products.find(x => x.id === id);
  view.path.push({ id, name: p.name });
  view.parentId = id;
  view.query = '';
  renderProducts();
}

function goBack() {
  if (view.path.length === 0) return openCity(currentCityId);
  view.path.pop();
  view.parentId = view.path.length ? view.path[view.path.length - 1].id : null;
  view.query = '';
  renderProducts();
}

function renderProducts() {
  screen = 'products';
  const title = view.path.length ? view.path[view.path.length - 1].name : view.shopName;
  const backLabel = view.path.length ? '← Назад' : '← Кафе и рестораны';
  app.innerHTML = `<button class="back" onclick="goBack()">${backLabel}</button>
    <h1>${esc(title)}</h1>
    <p class="muted">Доставка: ${view.fee} ₽</p>
    <input class="search" id="search" type="search" placeholder="Поиск по товарам"
      value="${esc(view.query)}" oninput="onSearch(this.value)">
    <div id="plist"></div>` + cartBar();
  renderList();
}

function onSearch(value) {
  view.query = value;
  renderList();
}

function renderList() {
  const el = document.getElementById('plist');
  if (!el) return;
  if (view.products.length === 0) {
    el.innerHTML = '<p class="muted">В этом заведении пока нет товаров.</p>';
    return;
  }
  const q = view.query.trim().toLowerCase();
  const list = q
    ? view.products.filter(p => !hasChildren(p.id) && p.name.toLowerCase().includes(q))
    : childrenOf(view.parentId);
  el.innerHTML = list.length
    ? list.map(productRow).join('')
    : '<p class="muted">Ничего не найдено.</p>';
}

function productRow(p) {
  const img = p.image_url
    ? `<img class="pthumb" src="${esc(p.image_url)}" alt="">`
    : '<div class="pthumb"></div>';

  if (hasChildren(p.id)) {
    const from = minPrice(p.id);
    return `<div class="prow" onclick="openFolder(${p.id})">
      ${img}
      <div class="pinfo">
        <b>${esc(p.name)}</b>
        ${p.description ? `<div class="muted">${esc(p.description)}</div>` : ''}
        <div class="price">${from != null ? 'от ' + from + ' ₽' : ''}</div>
      </div>
      <div class="pgo">›</div>
    </div>`;
  }

  const qty = qtyIn(view.shopId, p.id);
  const priceText = p.price_rub != null ? p.price_rub + ' ₽' : 'цена не указана';
  let action = '';
  if (p.price_rub != null) {
    action = qty
      ? `<div class="qty">
           <button onclick="changeQty(${view.shopId}, ${p.id}, -1)">−</button>
           <span>${qty}</span>
           <button onclick="changeQty(${view.shopId}, ${p.id}, 1)">+</button>
         </div>`
      : `<button class="addsmall" onclick="addToCart(${p.id})">+</button>`;
  }
  return `<div class="prow">
    ${img}
    <div class="pinfo">
      <b>${esc(p.name)}</b>
      ${p.description ? `<div class="muted">${esc(p.description)}</div>` : ''}
      <div class="price">${priceText}</div>
    </div>
    <div class="paction">${action}</div>
  </div>`;
}

function openCart() {
  if (cartCount() === 0) return showCities();
  screen = 'cart';
  let html = `<button class="back" onclick="${view ? 'renderProducts()' : 'showCities()'}">← Назад</button>` +
    '<h1>Корзина</h1>';
  for (const shop of Object.values(cart.shops)) {
    const items = Object.values(shop.items);
    const goods = shopGoods(shop);
    html += `<div class="shop-title">${esc(shop.shopName)}</div>`;
    html += items.map(i => `<div class="card">
        <b>${esc(i.name)}</b>
        <div class="price">${i.price_rub} ₽ × ${i.qty} = ${i.price_rub * i.qty} ₽</div>
        <div class="qty">
          <button onclick="changeQty(${shop.shopId}, ${i.id}, -1)">−</button>
          <span>${i.qty}</span>
          <button onclick="changeQty(${shop.shopId}, ${i.id}, 1)">+</button>
        </div>
      </div>`).join('');
    html += `<p class="muted">Товары: ${goods} ₽ · доставка: ${shopFee(shop)} ₽ · заведение: ${goods + shopFee(shop)} ₽</p>`;
  }
  html += `<p class="muted">Товаров на ${cartGoods()} ₽, доставка ${cartDelivery()} ₽</p>
    <p class="price">Итого к оплате: ${cartTotal()} ₽</p>
    <p class="muted">Каждое заведение оформляется отдельным заказом, и вам придёт отдельное сообщение.</p>
    <button class="add" onclick="openForm()">Оформить заказ</button>
    <button class="danger" onclick="clearCart()">Очистить корзину</button>`;
  app.innerHTML = html;
}

// ---------- Оформление ----------
function openForm() {
  screen = 'form';
  const u = tgUser();
  const d = formData || {
    name: tgName(),
    phone: '',
    nick: u?.username ? '@' + u.username : '',
    type: 'hotel',
    addr: '',
  };
  app.innerHTML = `
    <button class="back" onclick="openCart()">← Корзина</button>
    <h1>Оформление заказа</h1>
    <div class="form">
      <label>Имя<input id="f_name" type="text" value="${esc(d.name)}"></label>
      <label>Телефон<input id="f_phone" type="tel" placeholder="+7 900 123-45-67" value="${esc(d.phone)}"></label>
      <p class="hint">Укажите номер полностью, 10 цифр после +7.</p>
      <label>Ваш ник в Telegram (необязательно)
        <input id="f_nick" type="text" placeholder="@ivan" value="${esc(d.nick)}">
      </label>
      <label>Доставка
        <select id="f_type" onchange="updateAddrLabel()">
          <option value="hotel" ${d.type === 'hotel' ? 'selected' : ''}>В отель</option>
          <option value="apartment" ${d.type === 'apartment' ? 'selected' : ''}>В квартиру</option>
        </select>
      </label>
      <label id="f_addr_label">Название отеля и номер комнаты
        <textarea id="f_addr" rows="3">${esc(d.addr)}</textarea>
      </label>
      <button class="add" onclick="checkForm()">Далее</button>
      <p id="f_msg" class="muted"></p>
    </div>`;
  updateAddrLabel();
}

function updateAddrLabel() {
  const isHotel = document.getElementById('f_type').value === 'hotel';
  document.getElementById('f_addr_label').firstChild.textContent = isHotel
    ? 'Название отеля и номер комнаты'
    : 'Адрес: улица, дом, подъезд, этаж, квартира';
}

function checkForm() {
  const msg = document.getElementById('f_msg');
  const name = document.getElementById('f_name').value.trim();
  const phoneRaw = document.getElementById('f_phone').value;
  const nickRaw = document.getElementById('f_nick').value.trim();
  const type = document.getElementById('f_type').value;
  const addr = document.getElementById('f_addr').value.trim();

  if (name.length < 2) { msg.textContent = 'Укажите имя.'; return; }
  const phone = normalizePhone(phoneRaw);
  if (!phone) { msg.textContent = 'Телефон неполный. Пример: +7 900 123-45-67.'; return; }
  if (nickRaw && !cleanNick(nickRaw)) {
    msg.textContent = 'Ник: только латинские буквы, цифры и _, от 5 символов.';
    return;
  }
  if (addr.length < 5) { msg.textContent = 'Укажите адрес полностью.'; return; }

  formData = { name, phone, nick: nickRaw, type, addr };
  renderConfirm();
}

function renderConfirm() {
  screen = 'confirm';
  const lines = Object.values(cart.shops).map(s => {
    const goods = shopGoods(s);
    return `
    <div class="shop-title">${esc(s.shopName)}</div>
    ${Object.values(s.items).map(i =>
      `<p class="muted" style="margin:4px 0">${esc(i.name)} × ${i.qty} = ${i.price_rub * i.qty} ₽</p>`
    ).join('')}
    <p class="muted" style="margin:4px 0">Доставка: ${shopFee(s)} ₽ · заведение: ${goods + shopFee(s)} ₽</p>`;
  }).join('');
  app.innerHTML = `
    <button class="back" onclick="openForm()">← Изменить данные</button>
    <h1>Проверьте заказ</h1>
    ${lines}
    <p class="price">Итого к оплате: ${cartTotal()} ₽</p>
    <p class="muted">Имя: ${esc(formData.name)}<br>
      Телефон: ${esc(formData.phone)}<br>
      Доставка: ${formData.type === 'hotel' ? 'в отель' : 'в квартиру'}<br>
      Адрес: ${esc(formData.addr)}</p>
    <button class="add" id="sendBtn" onclick="sendOrder()">Подтвердить и отправить</button>
    <p id="f_msg" class="muted"></p>`;
}

async function sendOrder() {
  const btn = document.getElementById('sendBtn');
  const msg = document.getElementById('f_msg');
  btn.disabled = true;
  msg.textContent = 'Отправляем...';

  const u = tgUser();
  const body = {
    orders: Object.values(cart.shops).map(s => ({
      shop_id: s.shopId,
      items: Object.values(s.items).map(i => ({ id: i.id, qty: i.qty })),
    })),
    customer_name: formData.name,
    phone: formData.phone,
    delivery_type: formData.type,
    address: formData.addr,
    tg_user_id: u?.id ?? null,
    tg_name: tgName() || null,
    tg_username: formData.nick || u?.username || null,
  };

  const { data, error } = await db.functions.invoke('send-order', { body });
  if (error || !data?.ok) {
    btn.disabled = false;
    msg.textContent = 'Не удалось отправить: ' +
      (data?.error || error?.message || 'нет связи, попробуйте ещё раз');
    return;
  }

  const list = data.orders.map(o =>
    `<p>Заказ №${o.order_id} · ${esc(o.shop_name)} · ${o.total} ₽</p>`).join('');
  emptyCart();
  formData = null;
  app.innerHTML = `<h1>Спасибо!</h1>${list}
    <p><b>Итого: ${data.total} ₽ (с доставкой).</b> Мы свяжемся с вами по телефону.</p>
    <p>По вопросам по заказу пишите: <a href="https://t.me/${SUPPORT_NICK}">@${SUPPORT_NICK}</a></p>
    <button class="add" onclick="showCities()">В каталог</button>`;
}

showCities();
</script>
</body>
</html>
