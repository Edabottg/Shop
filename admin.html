<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 720px; }
  h2 { margin: 28px 0 8px; font-size: 18px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; margin: 4px 0 10px;
    font-size: 15px; border: 1px solid #bbb; border-radius: 6px; }
  input[type=checkbox] { width: auto; }
  button { padding: 8px 14px; margin: 0 6px 8px 0; border: none; border-radius: 6px;
    background: #2481cc; color: #fff; font-size: 14px; cursor: pointer; }
  button.secondary { background: #888; }
  button.danger { background: #c0392b; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .row span { flex: 1; }
  .row input[type=file] { width: 130px; margin: 0; font-size: 12px; }
  .muted { color: #888; font-size: 13px; }
  .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #eee; }
  .err { color: #c0392b; min-height: 20px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <h2>Вход в админку</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">
  <button onclick="login()">Войти</button>
  <p id="loginMsg" class="err"></p>
</div>

<div id="panel" class="hidden">
  <div class="row"><span><b>Админка</b></span><button class="secondary" onclick="logout()">Выйти</button></div>
  <p id="msg" class="err"></p>

  <h2>Города</h2>
  <div id="cities"></div>
  <input id="newCity" placeholder="Название города">
  <input id="newCityPhoto" type="file" accept="image/*">
  <button onclick="addCity()">Добавить город</button>

  <h2>Кафе и рестораны</h2>
  <select id="citySelect" onchange="loadShops()"></select>
  <div id="shops"></div>
  <input id="shopName" placeholder="Название заведения">
  <input id="shopDesc" placeholder="Описание (необязательно)">
  <input id="shopPhone" placeholder="Телефон (необязательно)">
  <input id="newShopPhoto" type="file" accept="image/*">
  <button onclick="addShop()">Добавить заведение</button>

  <h2>Товары</h2>
  <select id="shopSelect" onchange="loadProducts()"></select>
  <div id="products"></div>

  <h2 id="formTitle">Новый товар</h2>
  <label class="muted">Входит в группу</label>
  <select id="pParent"></select>
  <input id="pName" placeholder="Название, например «Лимонад» или «Мохито»">
  <textarea id="pDesc" rows="2" placeholder="Описание (необязательно)"></textarea>
  <input id="pPrice" type="number" placeholder="Цена, ₽ (для группы можно оставить пустым)">
  <input id="pImage" type="file" accept="image/*">
  <p class="muted" id="pImageNote"></p>
  <label><input type="checkbox" id="pStock" checked> В наличии</label>
  <div style="margin-top: 10px">
    <button onclick="saveProduct()">Сохранить товар</button>
    <button class="secondary" onclick="clearProductForm()">Очистить форму</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://uwafdyrpyrcnjliwystd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jIxy3j0mu8dLYCpa4T1hyg_npMmhEwD';
const BUCKET = 'product-images';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let cities = [], shops = [], products = [];
let editId = null, currentImageUrl = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function say(text, ok) {
  $('msg').style.color = ok ? '#2e7d32' : '#c0392b';
  $('msg').textContent = text;
}

async function uploadFile(file) {
  const safeName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
  const path = `${Date.now()}-${safeName}`;
  const { error } = await db.storage.from(BUCKET).upload(path, file);
  if (error) throw error;
  return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

// ---------- Вход ----------
async function init() {
  const { data } = await db.auth.getSession();
  if (data.session) showPanel();
  else $('login').classList.remove('hidden');
}

async function login() {
  const { error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value,
  });
  if (error) { $('loginMsg').textContent = 'Неверный email или пароль'; return; }
  showPanel();
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

function showPanel() {
  $('login').classList.add('hidden');
  $('panel').classList.remove('hidden');
  loadCities();
}

// ---------- Города ----------
async function loadCities() {
  const { data, error } = await db.from('cities').select('*').order('sort_order');
  if (error) return say(error.message);
  cities = data;
  $('citySelect').innerHTML = cities.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('cities').innerHTML = cities.map(c => `
    <div class="row">
      ${c.image_url ? `<img class="thumb" src="${esc(c.image_url)}" alt="">` : '<div class="thumb"></div>'}
      <span>${esc(c.name)}</span>
      <input type="file" accept="image/*" id="cityPhoto_${c.id}">
      <button class="secondary" onclick="saveCityPhoto(${c.id})">Фото</button>
      <button class="danger" onclick="delRow('cities', ${c.id}, 'Удалить город со всеми заведениями и товарами?')">Удалить</button>
    </div>`).join('') || '<p class="muted">Городов пока нет</p>';
  loadShops();
}

async function addCity() {
  const name = $('newCity').value.trim();
  if (!name) return say('Введите название города');
  let image_url = null;
  const file = $('newCityPhoto').files[0];
  if (file) {
    try { image_url = await uploadFile(file); }
    catch (e) { return say('Фото: ' + e.message); }
  }
  const { error } = await db.from('cities').insert({ name, image_url, sort_order: cities.length + 1 });
  if (error) return say(error.message);
  $('newCity').value = '';
  $('newCityPhoto').value = '';
  say('Город добавлен', true);
  loadCities();
}

async function saveCityPhoto(id) {
  const file = $('cityPhoto_' + id).files[0];
  if (!file) return say('Сначала выберите фото');
  try {
    const url = await uploadFile(file);
    const { error } = await db.from('cities').update({ image_url: url }).eq('id', id);
    if (error) throw error;
    say('Фото города сохранено', true);
    loadCities();
  } catch (e) {
    say('Фото: ' + e.message);
  }
}

// ---------- Заведения ----------
async function loadShops() {
  const cityId = $('citySelect').value;
  if (!cityId) {
    shops = [];
    renderShops();
    return loadProducts();
  }
  const { data, error } = await db.from('shops').select('*')
    .eq('city_id', cityId).order('sort_order');
  if (error) return say(error.message);
  shops = data;
  renderShops();
  loadProducts();
}

function renderShops() {
  $('shops').innerHTML = shops.map(s => `
    <div class="row">
      ${s.image_url ? `<img class="thumb" src="${esc(s.image_url)}" alt="">` : '<div class="thumb"></div>'}
      <span><b>${esc(s.name)}</b>${s.phone ? ' · ' + esc(s.phone) : ''}</span>
      <input type="file" accept="image/*" id="shopPhoto_${s.id}">
      <button class="secondary" onclick="saveShopPhoto(${s.id})">Фото</button>
      <button class="danger" onclick="delRow('shops', ${s.id}, 'Удалить заведение со всеми товарами?')">Удалить</button>
    </div>`).join('') || '<p class="muted">В этом городе заведений нет</p>';
  $('shopSelect').innerHTML = shops.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
}

async function addShop() {
  const cityId = Number($('citySelect').value);
  const name = $('shopName').value.trim();
  if (!cityId || !name) return say('Выберите город и введите название заведения');
  let image_url = null;
  const file = $('newShopPhoto').files[0];
  if (file) {
    try { image_url = await uploadFile(file); }
    catch (e) { return say('Фото: ' + e.message); }
  }
  const { error } = await db.from('shops').insert({
    city_id: cityId,
    name,
    description: $('shopDesc').value.trim() || null,
    phone: $('shopPhone').value.trim() || null,
    image_url,
    sort_order: shops.length + 1,
  });
  if (error) return say(error.message);
  ['shopName', 'shopDesc', 'shopPhone'].forEach(id => $(id).value = '');
  $('newShopPhoto').value = '';
  say('Заведение добавлено', true);
  loadShops();
}

async function saveShopPhoto(id) {
  const file = $('shopPhoto_' + id).files[0];
  if (!file) return say('Сначала выберите фото');
  try {
    const url = await uploadFile(file);
    const { error } = await db.from('shops').update({ image_url: url }).eq('id', id);
    if (error) throw error;
    say('Фото заведения сохранено', true);
    loadShops();
  } catch (e) {
    say('Фото: ' + e.message);
  }
}

// ---------- Товары и группы ----------
async function loadProducts() {
  const shopId = $('shopSelect').value;
  if (!shopId) {
    products = [];
    renderProducts();
    return;
  }
  const { data, error } = await db.from('products').select('*')
    .eq('shop_id', shopId).order('sort_order');
  if (error) return say(error.message);
  products = data;
  renderProducts();
}

// Строит список в порядке дерева: группа, затем её варианты с отступом
function flatTree(parentId = null, depth = 0, out = []) {
  products.filter(p => (p.parent_id ?? null) === parentId).forEach(p => {
    out.push({ p, depth });
    flatTree(p.id, depth + 1, out);
  });
  return out;
}

function descendantIds(id) {
  return id == null ? [] : flatTree(id).map(x => x.p.id);
}

function renderProducts() {
  const rows = flatTree();
  $('products').innerHTML = rows.map(({ p, depth }) => `
    <div class="row" style="padding-left:${depth * 24}px">
      ${p.image_url ? `<img class="thumb" src="${esc(p.image_url)}" alt="">` : '<div class="thumb"></div>'}
      <span>${depth ? '↳ ' : ''}<b>${esc(p.name)}</b><br>
        ${p.price_rub != null ? p.price_rub + ' ₽' : '<span class="muted">без цены (группа)</span>'} ·
        ${p.in_stock ? 'в наличии' : '<span class="muted">нет в наличии</span>'}</span>
      <button class="secondary" onclick="editProduct(${p.id})">Изменить</button>
      <button class="danger" onclick="delRow('products', ${p.id}, 'Удалить товар и все его варианты?')">Удалить</button>
    </div>`).join('') || '<p class="muted">В этом заведении товаров нет</p>';
  fillParentOptions();
}

function fillParentOptions() {
  const excluded = new Set([editId, ...descendantIds(editId)]);
  const current = $('pParent').value;
  const opts = flatTree()
    .filter(({ p }) => !excluded.has(p.id))
    .map(({ p, depth }) => `<option value="${p.id}">${'— '.repeat(depth)}${esc(p.name)}</option>`);
  $('pParent').innerHTML = '<option value="">— верхний уровень —</option>' + opts.join('');
  $('pParent').value = current;
}

function editProduct(id) {
  const p = products.find(x => x.id === id);
  editId = p.id;
  currentImageUrl = p.image_url;
  $('pName').value = p.name;
  $('pDesc').value = p.description || '';
  $('pPrice').value = p.price_rub ?? '';
  $('pStock').checked = p.in_stock;
  $('pImage').value = '';
  $('pImageNote').textContent = p.image_url
    ? 'Фото уже есть. Выберите новое, чтобы заменить.'
    : 'Фото нет.';
  $('formTitle').textContent = 'Редактирование товара';
  fillParentOptions();
  $('pParent').value = p.parent_id ?? '';
  $('formTitle').scrollIntoView();
}

function clearProductForm() {
  editId = null;
  currentImageUrl = null;
  ['pName', 'pDesc', 'pPrice'].forEach(id => $(id).value = '');
  $('pImage').value = '';
  $('pStock').checked = true;
  $('pImageNote').textContent = '';
  $('formTitle').textContent = 'Новый товар';
  fillParentOptions();
  $('pParent').value = '';
}

async function saveProduct() {
  const shopId = Number($('shopSelect').value);
  const name = $('pName').value.trim();
  const priceRaw = $('pPrice').value.trim();
  const price = priceRaw === '' ? null : parseInt(priceRaw);
  const parentRaw = $('pParent').value;
  if (!shopId) return say('Сначала выберите заведение');
  if (!name) return say('Укажите название');
  if (priceRaw !== '' && (!price || price < 0)) return say('Цена должна быть больше нуля или поле пустое');

  let imageUrl = currentImageUrl;
  const file = $('pImage').files[0];
  if (file) {
    try { imageUrl = await uploadFile(file); }
    catch (e) { return say('Фото: ' + e.message); }
  }

  const row = {
    shop_id: shopId,
    parent_id: parentRaw ? Number(parentRaw) : null,
    name,
    description: $('pDesc').value.trim() || null,
    price_rub: price,
    image_url: imageUrl,
    in_stock: $('pStock').checked,
  };

  const request = editId
    ? db.from('products').update(row).eq('id', editId)
    : db.from('products').insert(row);
  const { error } = await request;
  if (error) return say(error.message);

  say('Товар сохранён', true);
  clearProductForm();
  loadProducts();
}

// ---------- Удаление ----------
async function delRow(table, id, question) {
  if (!confirm(question)) return;
  const { error } = await db.from(table).delete().eq('id', id);
  if (error) return say(error.message);
  say('Удалено', true);
  loadCities();
}

init();
</script>
</body>
</html>
